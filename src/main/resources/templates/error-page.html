
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Erreur</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-box {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 480px;
            text-align: center;
        }
        .error-status {
            font-size: 64px;
            font-weight: bold;
            color: #c0392b;
            margin: 0;
        }
        .error-title {
            font-size: 24px;
            margin: 8px 0 16px;
        }
        .error-message {
            color: #555555;
            margin-bottom: 24px;
        }
        .error-links a {
            display: inline-block;
            margin: 0 8px;
            padding: 10px 18px;
            background: #2c3e50;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <p class="error-status" th:text="${status}">404</p>
        <h1 class="error-title" th:text="${title}">Introuvable</h1>
        <p class="error-message" th:text="${message}">Message d'erreur</p>
 
        <div class="error-links">
            <a href="javascript:history.back()">Retour</a>
            <a th:href="@{/events}">Événements</a>
        </div>
    </div>
</body>
</html>
